name: Run sidecar test
on:
  push:
    branches:
      - master

jobs:
  test:
    name: Run sidecar test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
  
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - name: Build Sidecar
        run: go build -o sidecar ./cmd/sidecar

      - name: Generate Nginx config with Sidecar
        run: |
          cat << EOF > config.toml
          [NginxConfig]
          ServerName = "localhost"
          ServerPort = 443
          OnlyListenIPv4 = true
          Location = "sidecar-test"
          Resolver = "1.1.1.1"
          SSLCertificate = "/etc/nginx/certs/server.crt"
          SSLPrivateKey = "/etc/nginx/certs/server.key"
          WorkDir = "/var/log/nginx"
          EnableListenHTTP2 = true
          EnableWebSocketProxy = true
          EnableModernTLSOnly = true

          [NginxConfig.NginxCustomHeader]
          X-Sidecar-Test = "pipeline"
          EOF
          ./sidecar configure-nginx -conf ./config.toml

      - name: Create test TLS certificate
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout certs/server.key \
            -out certs/server.crt \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost"
          sudo cp certs/server.crt /usr/local/share/ca-certificates/sidecar-nginx-test.crt
          sudo update-ca-certificates

      - name: Validate generated Nginx config
        run: |
          cat nginx.conf
          docker run --rm \
            --volume "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/certs:/etc/nginx/certs:ro" \
            nginx:stable nginx -t

      - name: Start Nginx in Docker
        run: |
          docker run --detach --name sidecar-test-nginx \
            --publish 443:443 \
            --volume "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/certs:/etc/nginx/certs:ro" \
            nginx:stable

      - name: Write Sidecar client config
        run: |
          rm -rf config.toml
          cat << EOF > config.toml
          [Client]
          ProxyPort = 4396
          OnlyListenIPv4 = true
          RunAsDaemon = true
          WorkDir = ""
          PriKeyPath = ""
          CertPath = ""
          LogLevel = "debug"
          GfwListUrl = "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt"

          [[Client.RemoteServers]]
          Host = "localhost:443"
          ComplexPath = "sidecar-test"

          [Client.RemoteServers.CustomHeaders]
          X-Sidecar-Test = "pipeline"
          EOF
          ./sidecar client -action start -conf ./config.toml
          sleep 15
          sudo cp ./sidecar-client.crt /usr/local/share/ca-certificates/sidecar-client.crt
          sudo update-ca-certificates
          sudo netstat -nutlp

      - name: Send Test request
        run: |
          curl --fail --show-error --verbose --head \
            --proxy http://127.0.0.1:4396 \
            https://www.google.com

      - name: Show Nginx and Sidecar logs
        run: |
          docker logs sidecar-test-nginx || true
          cat sidecar.log || true
